<h2 mat-dialog-title>{{ isEditMode ? 'Editar Producto' : 'Nuevo Producto' }}</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="flex-col">
    <mat-form-field appearance="outline">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="nombreProducto">
      <mat-error *ngIf="form.get('nombreProducto')?.hasError('required')">Nombre es requerido</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Precio</mat-label>
      <input matInput type="number" formControlName="precio">
      <mat-error *ngIf="form.get('precio')?.hasError('required')">Precio es requerido</mat-error>
      <mat-error *ngIf="form.get('precio')?.hasError('min')">Precio debe ser mayor o igual a 0</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Stock</mat-label>
      <input matInput type="number" formControlName="stock">
      <mat-error *ngIf="form.get('stock')?.hasError('required')">Stock es requerido</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Descripción</mat-label>
      <textarea matInput formControlName="descripcion"></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="close()">Cancelar</button>
  <button mat-raised-button color="primary" (click)="save()" [disabled]="form.invalid">Guardar</button>
</mat-dialog-actions>
