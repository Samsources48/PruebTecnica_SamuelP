<div class="catalog-container">
  <!-- Page Header -->
  <div class="page-header">
    <div class="header-content">
      <h1 class="page-title">Gestión de Productos</h1>
      <p class="page-subtitle">Administra el catálogo de productos disponibles</p>
    </div>
    <button class="btn-primary" (click)="openDialog()">
      <i class="pi pi-plus"></i>
      Nuevo Producto
    </button>
  </div>

  <!-- Data Card -->
  <div class="data-card">
    <!-- Loading State -->
    <div *ngIf="!(products$ | async)" class="loading-bar">
      <mat-progress-bar mode="indeterminate"></mat-progress-bar>
    </div>

    <!-- Table -->
    <div class="table-wrapper" *ngIf="products$ | async as products">
      <table mat-table [dataSource]="products" class="data-table">

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Producto</th>
          <td mat-cell *matCellDef="let element">
            <div class="product-info">
              <div class="product-icon">
                <i class="pi pi-box"></i>
              </div>
              <div class="product-details">
                <span class="product-name">{{element.nombreProducto}}</span>
                <span class="product-desc">{{element.descripcion || 'Sin descripción'}}</span>
              </div>
            </div>
          </td>
        </ng-container>

        <ng-container matColumnDef="price">
          <th mat-header-cell *matHeaderCellDef>Precio</th>
          <td mat-cell *matCellDef="let element">
            <span class="price-tag">{{element.precio | currency}}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="stock">
          <th mat-header-cell *matHeaderCellDef>Stock</th>
          <td mat-cell *matCellDef="let element">
            <div class="stock-badge" [class.low]="element.stock < 10" [class.out]="element.stock === 0">
              <span class="stock-value">{{element.stock}}</span>
              <span class="stock-label">unidades</span>
            </div>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="actions-header">Acciones</th>
          <td mat-cell *matCellDef="let element" class="actions-cell">
            <button mat-icon-button class="edit-btn" (click)="openDialog(element)" matTooltip="Editar">
              <i class="pi pi-pencil"></i>
            </button>
            <button mat-icon-button class="delete-btn" (click)="deleteProduct(element.idProducto)"
              matTooltip="Eliminar">
              <i class="pi pi-trash"></i>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>

    <!-- Empty State -->
    <div *ngIf="(products$ | async)?.length === 0" class="empty-state">
      <i class="pi pi-box"></i>
      <p>No se encontraron productos</p>
      <button class="btn-primary mt-2" (click)="openDialog()">
        <i class="pi pi-plus"></i> Agregar producto
      </button>
    </div>
  </div>
</div>
