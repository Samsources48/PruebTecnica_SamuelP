<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #drawer class="sidenav" fixedInViewport [attr.role]="(isHandset$ | async) ? 'dialog' : 'navigation'"
    [mode]="(isHandset$ | async) ? 'over' : 'side'" [opened]="(isHandset$ | async) === false">

    <!-- Logo Section -->
    <div class="sidebar-header">
      <div class="logo-container">
        <div class="logo-icon">
          <i class="pi pi-th-large"></i>
        </div>
        <div class="logo-text">
          <span class="logo-title">Gestion de Clientes</span>
        </div>
      </div>
    </div>

    <!-- Navigation -->
    <nav class="sidebar-nav">
      <a class="nav-item" routerLink="/dashboard" routerLinkActive="active">
        <i class="pi pi-home"></i>
        <span>Dashboard</span>
      </a>
      <a class="nav-item" routerLink="/clients" routerLinkActive="active">
        <i class="pi pi-users"></i>
        <span>Clientes</span>
      </a>
      <a class="nav-item" routerLink="/products" routerLinkActive="active">
        <i class="pi pi-box"></i>
        <span>Productos</span>
      </a>
      <a class="nav-item" routerLink="/orders" routerLinkActive="active">
        <i class="pi pi-shopping-cart"></i>
        <span>Pedidos</span>
      </a>
    </nav>

    <!-- Logout Button -->
    <div class="sidebar-footer">
      <button class="logout-btn" (click)="logout()">
        <i class="pi pi-sign-out"></i>
        <span>Cerrar Sesión</span>
      </button>
    </div>
  </mat-sidenav>

  <mat-sidenav-content>
    <!-- Top Navbar -->
    <header class="top-navbar">
      <div class="navbar-left">
        <button type="button" aria-label="Toggle sidenav" class="menu-toggle" (click)="drawer.toggle()"
          *ngIf="isHandset$ | async">
          <i class="pi pi-bars"></i>
        </button>
        <h1 class="page-title">{{ pageTitle }}</h1>
      </div>
      
      <div class="navbar-right">
        <button class="icon-btn">
          <i class="pi pi-cog"></i>
        </button>
        <button class="icon-btn">
          <i class="pi pi-bell"></i>
        </button>
        <div class="user-avatar" *ngIf="user()">
          {{ user()?.name?.charAt(0) || 'U' }}
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <div class="main-content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
