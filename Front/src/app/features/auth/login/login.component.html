<div class="login-wrapper">
  <div class="login-card">
    <!-- Header -->
    <div class="login-header">
      <h1>Inicio de Sesión</h1>
      <p class="subtitle">Ingrese sus credenciales para acceder al dashboard de gestión</p>
    </div>

    <!-- Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <!-- Email Field -->
      <div class="form-group">
        <label for="email">Usuario</label>
        <div class="input-wrapper">
          <input id="email" type="text" formControlName="email" placeholder="nombre@empresa.com" class="form-input">
        </div>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <div class="password-header">
          <label for="password">Contraseña</label>
        </div>
        <div class="input-wrapper">
          <input id="password" [type]="showPassword ? 'text' : 'password'" formControlName="password"
            placeholder="Ingrese su contraseña" class="form-input">
          <button type="button" class="toggle-password" (click)="togglePassword()">
            <i [class]="showPassword ? 'pi pi-eye-slash' : 'pi pi-eye'"></i>
          </button>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="login-button" [disabled]="loginForm.invalid">
        Iniciar Sesión
      </button>
    </form>
  </div>

  <!-- Bottom Footer -->
  <div class="app-footer">
    <span>© 2026 ClientManager Pro. Todos los derechos reservados.</span>
    <span class="version">v2.4.0 stable</span>
  </div>
</div>
